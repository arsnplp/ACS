# /etc/nginx/sites-available/acs.nairox.fr
# Site statique Astro : URL avec slash final, page 404 personnalisée, cache long sur les assets.
server {
    listen 80;
    listen [::]:80;
    server_name acs.nairox.fr;

    root /var/www/acs.nairox.fr/html;
    index index.html;

    # Certbot ajoutera automatiquement la redirection HTTPS et le bloc 443.

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # /services/plomberie → /services/plomberie/ (301)
    location ~ ^/(services|realisations|zone-intervention|blog|devis|a-propos|plan-du-site|mentions-legales|politique-confidentialite)(/[^./]+)*$ {
        return 301 $uri/;
    }

    # Assets avec hash : cache d'un an
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(woff2|avif|webp|jpg|jpeg|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
