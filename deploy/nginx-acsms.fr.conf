# /etc/nginx/sites-available/acsms.fr
# Site statique Astro : URL avec slash final, page 404 personnalisée, cache long sur les assets,
# compression, en-têtes de sécurité, www → sans www.
# Certbot (--nginx --redirect) ajoute lui-même le bloc 443 et la redirection http → https.
server {
    listen 80;
    listen [::]:80;
    server_name acsms.fr www.acsms.fr;

    root /var/www/acsms.fr/html;
    index index.html;

    # Une seule version du site : www.acsms.fr → acsms.fr (fonctionne aussi dans le bloc 443 créé par certbot)
    if ($host = www.acsms.fr) {
        return 301 https://acsms.fr$request_uri;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # /services/plomberie → /services/plomberie/ (301)
    location ~ ^/(services|realisations|zone-intervention|blog|devis|a-propos|plan-du-site|mentions-legales|politique-confidentialite|cgu)(/[^./]+)*$ {
        return 301 $uri/;
    }

    # Assets avec hash : cache d'un an
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(woff2|avif|webp|jpg|jpeg|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
    location = /site.webmanifest { types { } default_type application/manifest+json; }

    # Compression (brotli si le module est installé, sinon gzip)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml application/manifest+json text/plain;
    gzip_min_length 1024;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
