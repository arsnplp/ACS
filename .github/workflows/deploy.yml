# Déploiement automatique : à chaque push sur main, le site est construit
# puis le dossier dist/ est envoyé sur le VPS (rsync via SSH).
# Secrets à créer dans GitHub → Settings → Secrets and variables → Actions :
#   VPS_HOST      217.65.144.174
#   VPS_USER      deploy
#   VPS_SSH_KEY   clé privée du compte deploy (générée sur le VPS, voir README)
#   PUBLIC_FORM_WEBHOOK   (facultatif) URL du webhook n8n
name: Déployer acsms.fr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          PUBLIC_SITE_URL: https://acsms.fr
          PUBLIC_FORM_WEBHOOK: ${{ secrets.PUBLIC_FORM_WEBHOOK }}
        run: npm run build

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Envoyer dist/ sur le VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/acsms.fr/html/"
